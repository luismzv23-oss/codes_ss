version: '3.8'

services:
  # Servidor Web CodeIgniter 4 (PHP 8.2-FPM + Nginx)
  web:
    image: nginx:alpine
    container_name: codex_ss_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - php
      - db
      - redis

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: codex_ss_php
    restart: always
    volumes:
      - .:/var/www/html
    environment:
      CI_ENVIRONMENT: production
      database.default.hostname: db
      database.default.database: codex_ss
      database.default.username: root
      database.default.password: secret

  # Servidor WebSocket Node.js (Socket.io)
  websocket:
    build:
      context: ./websocket-server
      dockerfile: Dockerfile
    container_name: codex_ss_websocket
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000

  # Base de Datos MySQL 8.0
  db:
    image: mysql:8.0
    container_name: codex_ss_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: codex_ss
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Cache & Session Storage Redis 7.0
  redis:
    image: redis:7-alpine
    container_name: codex_ss_redis
    restart: always
    ports:
      - "6379:6379"

  # Cola de Mensajería B2B RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: codex_ss_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  db_data:
